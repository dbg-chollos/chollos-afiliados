name: Generar y publicar sitio

on:
  schedule:
    # Todos los dias a las 06:00 UTC. Cambia esto si quieres otra frecuencia.
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pipeline de contenido
        run: python scripts/run_pipeline.py

      # Cerrojo: el sitio de ofertas y la app privada de la liga son cosas
      # separadas. Si algo de la app aparece en docs/, este paso falla y no se
      # publica nada. Mejor un despliegue en rojo que una web con lo que no toca.
      - name: Comprobar que la app de la liga no esta en el sitio
        run: python scripts/comprobar_separacion.py

      - name: Publicar productos nuevos en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_telegram.py

      - name: Publicar cambios generados
        run: |
          git config user.name "chollos-bot"
          git config user.email "chollos-bot@users.noreply.github.com"
          git add docs data/telegram_posted.txt
          git diff --cached --quiet || git commit -m "Actualizacion automatica del sitio"
          git push
