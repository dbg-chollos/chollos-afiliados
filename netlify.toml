# Configuracion para publicar SOLO la app de la liga, en su propio dominio.
#
# El sitio de ofertas (docs/) no se toca ni se publica aqui: son dos webs
# distintas, sin nada en comun.
#
# A proposito no hay paso de construccion: se publica `dist-liga/` tal cual,
# que ya va hecha en el repositorio. Asi el despliegue no puede fallar por un
# script ni por una version de Python. Para regenerar esa carpeta despues de
# tocar la app:  python scripts/preparar_web_liga.py

[build]
  publish = "dist-liga"

# Que no la indexe ningun buscador aunque alguien comparta la direccion.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
